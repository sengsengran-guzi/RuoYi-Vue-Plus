# sensenran-guzi 生产/预发部署栈
#
# 使用（必须从 RuoYi-Vue-Plus/ 根目录跑，--env-file 是 compose 解析 ${VAR} 的来源）：
#   cd RuoYi-Vue-Plus
#   cp .env.example .env  （首次，按注释填写）
#   docker compose --env-file .env -f script/docker/docker-compose.deploy.yml up -d --build
#
# 服务：MySQL + Redis + ruoyi-admin（OSS 使用阿里云 OSS，在 admin 网页配置 sys_oss_config，不在此处）
#
# 端口策略：
#   - MySQL 3306 → 暴露到宿主机（运维 Navicat 直连，需配防火墙白名单）
#   - Redis 6379 → 不暴露到宿主机（仅容器网络内访问，更安全）
#   - ruoyi-admin 8080 → 暴露到宿主机 127.0.0.1:8080（宝塔 nginx 反代）

services:
  mysql:
    image: mysql:8.0
    container_name: gz-mysql-${DEPLOY_ENV:?DEPLOY_ENV is required}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ry-vue}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --init-connect=SET NAMES utf8mb4
      - --skip-character-set-client-handshake
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
      - --max_connections=500
    ports:
      # 暴露 3306 到宿主机（运维 Navicat 直连）
      # ⚠️ 服务器防火墙必须配置白名单，仅允许运维 IP 访问
      - "3306:3306"
    volumes:
      - ../../mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: gz-redis-${DEPLOY_ENV:?}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # 用 $$ 转义，让密码在容器内 shell 展开（而不是 compose 解析时）
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - ../../redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  ruoyi-admin:
    build:
      # context 指向仓库根目录（compose 文件在 script/docker/ 下）
      # 多阶段 Dockerfile 在仓库根目录，构建产物 ruoyi-admin.jar
      context: ../..
      dockerfile: Dockerfile
    image: sensenran-guzi/ruoyi-admin:${DEPLOY_ENV:?}
    container_name: gz-ruoyi-admin-${DEPLOY_ENV:?}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ⚠️ 调试期临时暴露公网 8080（域名+HTTPS 未就绪，小程序开发者工具需直连服务器后端）
    # 上线前必须改回 "127.0.0.1:8080:8080"（仅宿主机回环，由宝塔 nginx 反代 + HTTPS）
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      # 数据库走 docker 服务名解析（覆盖 application-prod.yml 的 MASTER_DB_URL 默认值）
      MASTER_DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ry-vue}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true"
      MASTER_DB_USERNAME: root
      MASTER_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      # Redis 用 docker 服务名解析
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # 微信小程序真实 AppID/Secret（甲方提供）— 缺省 wxMOCK 时后端走 WxMockLoginAdapter（登录/手机号全 mock）。
      # 配齐后自动切 WxRealLoginAdapter（jscode2session）+ WxRealPhoneAdapter（getuserphonenumber）。
      WX_MA_APPID: ${WX_MA_APPID:-wxMOCK}
      WX_MA_SECRET: ${WX_MA_SECRET:-}
      # 拼豆核销码 HMAC 签名密钥（GZ-BEAN-004）— prod 必填，否则 ProdSecretGuard fail-fast 拒绝启动。
      # 生成：openssl rand -base64 32
      GZ_BEAN_QR_SECRET: ${GZ_BEAN_QR_SECRET:?GZ_BEAN_QR_SECRET is required（核销码 HMAC 密钥，≥32 随机字符，生成 openssl rand -base64 32）}
      # 微信支付 real 凭证（GZ-PAY-001）— prod 必须 real，否则 ProdSecretGuard + WechatPayV3ClientImpl 双重 fail-fast。
      # 机密值从部署机 $REPO_DIR/.env 注入（compose --env-file .env 读取，见 .env.example 微信支付段）。
      # pem 文件不入 git，需手动放到 $REPO_DIR/secrets/wechat-pay/（见下方只读卷）。
      # ⚠️ 不要让 WECHAT_PAY_CLIENT_MODE 落回 mock —— prod 下零验签回调可被伪造刷单。
      WECHAT_PAY_CLIENT_MODE: ${WECHAT_PAY_CLIENT_MODE:-mock}
      WECHAT_PAY_APPID: ${WECHAT_PAY_APPID:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_CERT_SERIAL: ${WECHAT_PAY_CERT_SERIAL:-}
      WECHAT_PAY_PUBLIC_KEY_ID: ${WECHAT_PAY_PUBLIC_KEY_ID:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL:-}
      # pem 路径固定为容器内挂载点（覆盖 gz-pay.env 里的 macOS host 绝对路径）；对应下方只读卷。
      WECHAT_PAY_PRIVATE_KEY_PATH: /app/secrets/wechat-pay/1731037015_20260622_cert/apiclient_key.pem
      WECHAT_PAY_CERT_PATH: /app/secrets/wechat-pay/1731037015_20260622_cert/apiclient_cert.pem
      WECHAT_PAY_PUBLIC_KEY_PATH: /app/secrets/wechat-pay/pub_key.pem
    volumes:
      - ../../logs:/app/logs
      # 微信支付 pem 证书（apiclient_key/cert + 微信支付公钥）只读挂载；部署机需把 secrets/wechat-pay/ 同布局放到仓库根下。
      - ../../secrets/wechat-pay:/app/secrets/wechat-pay:ro
    healthcheck:
      # liveness probe（只检查进程存活，不连下游服务，比 /actuator/health 健壮）
      # Spring Boot 3.x 默认开启 liveness/readiness probe
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
