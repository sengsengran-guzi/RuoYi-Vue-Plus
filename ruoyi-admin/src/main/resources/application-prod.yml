--- # 微信小程序登录配置（GZ-SYS-002 / 多小程序 ADR-0019 §1）— prod 由 env var 注入真实 AppID/Secret
wx:
  miniapp:
    # 无 clientid 上下文（@Async 发货上报 / cron / curl 调试）时落到哪个小程序；必须是 apps 的 key
    default-client-id: mp-applet-sensenran-guzi
    # 按 clientid 索引的小程序清单（key = mp 端 VITE_APP_CLIENT_ID / 请求 header clientid）。
    # 没登记的 clientid 在登录/手机号口径直接抛错（WxAppResolver.currentApp 严格口径）——
    # 既不会静默拿另一个小程序的 appid/secret 去调微信，也不会静默降级 mock 登录。
    apps:
      # 谷子宇宙（现小程序）：appid 非机密（已绑商户 1731037015），secret 走 env var
      mp-applet-sensenran-guzi:
        appid: ${WX_MA_APPID:wx2f8b93e09703f07d}
        secret: ${WX_MA_SECRET:}
    session-key-ttl-seconds: ${WX_MA_SESSION_KEY_TTL:86400}
    # 业务 token TTL（秒），30 天（ADR-0009 登录态长效；失效由 mp 静默 wx.login 续期）
    token-ttl-seconds: ${WX_MA_TOKEN_TTL:2592000}

--- # 谷子宇宙拼团小程序（clientid=mp-applet-gz-jp）— 仅当本环境声明「要服务拼团」时才注册
# 开关 = 激活 profile jp（部署机 .env 加 SPRING_PROFILES_INCLUDE=jp，compose 已透传该变量）。
# 上线三步，缺任何一步都以「响亮的错」暴露，不会静默走 mock：
#   1. .env  SPRING_PROFILES_INCLUDE=jp     不加 → 拼团 clientid 的登录被明确拒绝（未配置的小程序客户端），现小程序照常营业
#   2. .env  WX_JP_MA_APPID=<真 appid>      加了 1 漏 2 → ProdSecretGuard 点名 [mp-applet-gz-jp] 拒绝启动
#   3. .env  WX_JP_MA_SECRET=<真 secret>    漏 3 → 登录调 jscode2session 返 invalid appsecret(40125)，不影响现小程序
# 为什么不无条件登记：拼团 appid 到手前（甲方备案中）无条件登记 = 每次部署都被守卫拒启动，
# 线上真实营业的现小程序会跟着起不来。appid 到手后想去掉这个开关，删掉本段的 on-profile 行即可。
spring.config.activate.on-profile: jp
wx:
  miniapp:
    apps:
      mp-applet-gz-jp:
        appid: ${WX_JP_MA_APPID:}
        secret: ${WX_JP_MA_SECRET:}
        # 写进 gz_user.register_source（GZ-SYS-023）；不配会继承全局 mp_wechat，admin 分不清用户来自哪个小程序
        register-source: mp_wechat_jp

--- # 拼豆核销码签名密钥（GZ-BEAN-004）— prod 必须走 env var GZ_BEAN_QR_SECRET（生产前生成 ≥ 32 字符随机串）
gz:
  bean:
    qr:
      signing-secret: ${GZ_BEAN_QR_SECRET:CHANGE_ME_BEFORE_PROD_DEPLOY}
  # 微信支付通道（GZ-PAY-001）— 商户 1731037015 为「微信支付公钥」模式（RSAPublicKeyConfig）。
  # 非机密（appid / mch-id / serial / public-key-id）可入 git；机密（api-v3-key / 私钥）只走 env var，空缺时 real fail-fast（强约束 #4）。
  pay:
    # 【进程级全局】mock/real 开关，与 wx.miniapp 的按小程序 appid 正交（ADR-0019 §5）——
    # 同一环境两个小程序的收款模式必然相同，刻意不做成按小程序。
    client-mode: ${WECHAT_PAY_CLIENT_MODE:mock}
    # ⚠️ 统一下单 + 调起签名的 appid 已【不再读这里】（ADR-0019 §3 / GZ-SYS-022）。解析顺序：
    #   ① gz_pay_channel.appid（按 client_id 一行，需要「收款 appid ≠ 登录 appid」时才配）
    #   ② wx.miniapp.apps.<clientid>.appid ← 默认走这条（payer.openid 就是它签发的，同源）
    #   ③ 本值（兜底，保证历史配置形态行为不劣化）
    # 拼团小程序上线 = 补 wx.miniapp（见上面 wx.miniapp 段注释）即可，本段无需再加一份 appid。
    # 商户号（mch-id）两个小程序共用，不变。
    appid: ${WECHAT_PAY_APPID:wx2f8b93e09703f07d}
    mch-id: ${WECHAT_PAY_MCH_ID:1731037015}   # 成都谷子宇宙贸易有限公司 · 谷子宇宙
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    mch-cert-serial: ${WECHAT_PAY_CERT_SERIAL:7226DDBCDF20307DC285256E52370A855C89C0AD}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    cert-path: ${WECHAT_PAY_CERT_PATH:}
    public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}   # 微信支付公钥 pem，甲方商户平台-API安全下载
    public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}       # PUB_KEY_ID_xxxxx，同页可见
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    refund-notify-url: ${WECHAT_PAY_REFUND_NOTIFY_URL:}
    # 微信支付「发货管理/发货信息录入」上报总开关。默认开：微信支付强制要求小程序支付后上传发货信息
    # （拼豆服务类也被微信纳入，未上传影响订单资金结算 —— 微信已发警告）。拼豆按虚拟商品 type3 上报。
    # 注：与「交易组件-购物订单」(消费者订单中心,电商类目专属,经营类目超出范围) 无关，那个忽略。
    # kill switch：若上报接口返权限错误，注入 WECHAT_PAY_SHIPPING_UPLOAD_ENABLED=false 临时关并查 last_error。
    shipping-upload-enabled: ${WECHAT_PAY_SHIPPING_UPLOAD_ENABLED:true}
    test:
      amount-cent: 1
  # mp 真机自测入口（/app/gz/test/**）总开关。prod 默认关（防生产被刷真实订单/打款）；
  # Kevin 真机测试窗口临时注入 GZ_TEST_ENABLED=true 重启开，测完关回。
  test:
    enabled: ${GZ_TEST_ENABLED:false}
  # 本地补偿定时任务（路 C）—— 未部署 SnailJob 时用 Spring @Scheduled 直接跑影响资金/预约正确性的关键补偿任务
  # （拼豆未付占位回收 / 支付主动查单 / 发货上传兜底 / 支付单超时）。prod 默认开；
  # 日后部署 SnailJob 集群（路 A）→ 注入 GZ_LOCAL_SCHEDULER_ENABLED=false 关掉本地版避免与控制台 cron 双跑。
  local-scheduler:
    enabled: ${GZ_LOCAL_SCHEDULER_ENABLED:true}
